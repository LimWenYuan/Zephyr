  name: Fetch Air Quality

  on:
    schedule:
      - cron: "0 0 * * *"   # run every midnight
    workflow_dispatch:

  jobs:
    fetch-air:
      runs-on: ubuntu-latest

      steps:
        - name: Show workflow info
          run: |
            echo "Workflow started"
            echo "Commit SHA: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF"
            echo "Repository: $GITHUB_REPOSITORY"

        - name: Check secret availability
          env:
            SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          run: |
            echo "Checking secret..."
            echo "Key length: ${#SUPABASE_KEY}"

        - name: Call Supabase Edge Function
          env:
            SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          run: |
            echo "Calling Supabase Edge Function..."
            
            curl -v --fail --retry 3 --retry-delay 5 \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Content-Type: application/json" \
              https://vrdamvurihydlguadhjy.functions.supabase.co/fetch-air-quality
            
            echo "Request finished"

        - name: Workflow finished
          run: |
            echo "Job completed successfully"

